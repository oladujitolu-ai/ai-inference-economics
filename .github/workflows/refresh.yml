name: Weekly price refresh

on:
  schedule:
    - cron: "0 13 * * 1"   # every Monday, 13:00 UTC
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install openpyxl
      - name: Fetch live prices, rebuild model, charts, README and web page
        run: python refresh.py
      - name: Commit the refreshed outputs
        run: |
          git config user.name "price-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly refresh: $(date -u +%Y-%m-%d)"
          git push
