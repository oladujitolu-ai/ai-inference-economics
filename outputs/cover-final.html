<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:627px;position:relative;overflow:hidden;background:#0B0F0D;color:#F2EFE9;font-family:'Inter Tight','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:url('racks-photo.jpg') 62% 50%/cover no-repeat;filter:saturate(.8) contrast(1.06) brightness(.9)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,11,10,.94) 0%,rgba(8,11,10,.86) 38%,rgba(8,11,10,.35) 66%,rgba(8,11,10,.15) 100%),linear-gradient(0deg,rgba(8,11,10,.55),rgba(8,11,10,0) 40%)}
.wrap{position:absolute;inset:0;padding:46px 64px 42px;display:flex;flex-direction:column}
.mast{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#BDB5A8}
.mast b{font-weight:500;color:#F2EFE9;display:flex;align-items:center;gap:12px}
.mast b:before{content:'';width:9px;height:9px;background:#D9A55B;border-radius:50%}
.rule{height:1px;background:rgba(242,239,233,.22);margin-top:18px}
h1{margin:auto 0 0;font-weight:600;font-size:78px;line-height:1.0;letter-spacing:-.035em;max-width:760px}
h1 span{color:#D9A55B}
.sub{margin-top:22px;font-size:26px;font-weight:500;letter-spacing:-.01em;color:#CFC7BA;max-width:640px}
.foot{margin-top:34px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#BDB5A8}
.foot i{font-style:normal;color:#F2EFE9}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="wrap">
  <div class="mast"><b>The Economics of AI</b><span>No. 01 &nbsp;/&nbsp; October 2026</span></div>
  <div class="rule"></div>
  <h1>What it really costs to serve <span>an AI model</span></h1>
  <div class="sub">Some AI companies charge less than it costs them.</div>
  <div class="foot"><span><i>tolulopeoladuji.substack.com</i></span><span>21 providers &nbsp;/&nbsp; live price tracker</span></div>
</div>
</body></html>
